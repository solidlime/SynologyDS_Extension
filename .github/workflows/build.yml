name: Build & Release

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate icons
        run: npm run icons

      - name: Build extension
        run: node scripts/build.js

      - name: Verify manifest version
        run: node -e "const m=require('./dist/manifest.json'),p=require('./package.json');if(m.version!==p.version)throw new Error('manifest '+m.version+' != package '+p.version);console.log('manifest version',m.version)"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    # A tag push releases that tag. A push to main also releases, when
    # package.json names a version that has no release yet.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released — skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is not released yet."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate icons
        if: steps.v.outputs.new == 'true'
        run: npm run icons

      - name: Build extension
        if: steps.v.outputs.new == 'true'
        run: node scripts/build.js

      - name: Zip dist/
        if: steps.v.outputs.new == 'true'
        run: |
          cd dist
          zip -r "../synology-ds-extension-${{ steps.v.outputs.tag }}.zip" .
          cd ..

      - name: Create GitHub Release
        if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Synology DS Extension ${{ steps.v.outputs.tag }}
          body: |
            ## Installation
            1. Download `synology-ds-extension-${{ steps.v.outputs.tag }}.zip`
            2. Extract the ZIP
            3. Open `chrome://extensions/` → Enable **Developer mode**
            4. Click **Load unpacked** → select the extracted folder
          files: synology-ds-extension-${{ steps.v.outputs.tag }}.zip
          draft: false
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
