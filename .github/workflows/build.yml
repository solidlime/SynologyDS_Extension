name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Generate icons
        run: npm run icons

      - name: Build extension
        run: node scripts/build.js

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run icons

      - name: Build extension
        run: node scripts/build.js

      - name: Zip dist/
        run: |
          cd dist
          zip -r ../synology-ds-extension-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Synology DS Extension ${{ github.ref_name }}
          body: |
            ## Installation
            1. Download `synology-ds-extension-${{ github.ref_name }}.zip`
            2. Extract the ZIP
            3. Open `chrome://extensions/` → Enable **Developer mode**
            4. Click **Load unpacked** → select the extracted folder
          files: synology-ds-extension-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
